[project]
name = "mcpvenom"
version = "0.1.0"
description = "Behavioral security testing for MCP-based AI agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
    {name = "Farooq Shaikh", email = "farooq.shaikh@dynatrace.com"},
    {name = "Biagio Montaruli", email = "biagio.montaruli@dynatrace.com"}
]
keywords = ["mcp", "security", "fuzzing", "ai-agents", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
mcpvenom = "mcpvenom.cli:main"

[project.urls]
Repository = "https://github.com/dynatrace-research/mcpvenom"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpvenom"]
artifacts = ["src/mcpvenom/scenarios/*.yaml"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
